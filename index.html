<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Tempo</title>
    <style>
      :root {
        --bg: #f5f6fa;
        --card: #ffffff;
        --border: #e2e4ee;
        --text: #12141a;
        --muted: #4b4f58;
        --brand: #3654ff;
        --brand-contrast: #ffffff;
        --success: #1f9d55;
        --error: #d64545;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1016;
          --card: #171a22;
          --border: #262a35;
          --text: #f3f4f8;
          --muted: #9aa0ac;
          --brand: #6b82ff;
          --brand-contrast: #0e1016;
          --success: #4ade80;
          --error: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        position: relative;
        width: 420px;
        max-width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px 32px;
        text-align: center;
      }
      .lang-toggle {
        position: absolute;
        top: 14px;
        right: 14px;
        padding: 6px 10px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
      }
      .lang-toggle:hover { color: var(--text); }
      .wordmark {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--brand);
        margin-bottom: 28px;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        background: color-mix(in srgb, var(--success) 15%, transparent);
        color: var(--success);
      }
      .icon.error {
        background: color-mix(in srgb, var(--error) 15%, transparent);
        color: var(--error);
      }
      .icon.idle {
        background: color-mix(in srgb, var(--muted) 15%, transparent);
        color: var(--muted);
      }
      h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; }
      p { margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: var(--muted); }
      .btn {
        display: inline-block;
        margin-top: 16px;
        padding: 13px 28px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        background: var(--brand);
        color: var(--brand-contrast);
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <button id="lang-toggle" class="lang-toggle" type="button"></button>
      <div class="wordmark">tempo</div>

      <div id="idle">
        <div class="icon idle" aria-hidden="true">&#9993;</div>
        <h1 data-i18n="idleTitle"></h1>
        <p data-i18n="idleBody"></p>
      </div>

      <div id="success" hidden>
        <div class="icon" aria-hidden="true">&#10003;</div>
        <h1 data-i18n="successTitle"></h1>
        <p data-i18n="successBody"></p>
      </div>

      <div id="error" hidden>
        <div class="icon error" aria-hidden="true">&#33;</div>
        <h1 id="error-title" data-i18n="errorTitle"></h1>
        <p id="error-body" data-i18n="errorBody"></p>
      </div>
    </main>

    <script>
      (function () {
        var STRINGS = {
          fr: {
            lang: "fr",
            title: "Confirmation e-mail — Tempo",
            idleTitle: "Rien à confirmer ici",
            idleBody: "Ouvrez le lien de confirmation reçu par e-mail pour activer votre compte ou valider votre nouvelle adresse.",
            successTitle: "Adresse e-mail confirmée",
            successBody: "Votre compte Tempo est activé. Vous pouvez retourner dans l'application et vous connecter.",
            errorTitle: "Lien invalide ou expiré",
            errorBody: "Ce lien de confirmation n'est plus valable. Ouvrez l'application et demandez un nouvel e-mail de confirmation.",
            serverErrorTitle: "La confirmation a échoué",
            serverErrorBody: "Une erreur serveur nous a empêchés de confirmer votre adresse e-mail. Réessayez dans quelques minutes en rouvrant le lien. Si le problème persiste, contactez le support.",
          },
          en: {
            lang: "en",
            title: "Email confirmation — Tempo",
            idleTitle: "Nothing to confirm here",
            idleBody: "Open the confirmation link from your email to activate your account or confirm your new address.",
            successTitle: "Email confirmed",
            successBody: "Your Tempo account is active. You can go back to the app and sign in.",
            errorTitle: "Invalid or expired link",
            errorBody: "This confirmation link is no longer valid. Open the app and request a new confirmation email.",
            serverErrorTitle: "Confirmation failed",
            serverErrorBody: "A server error stopped us from confirming your email. Try again in a few minutes by reopening the link. If it keeps happening, contact support.",
          },
        };

        var toggle = document.getElementById("lang-toggle");
        var current;

        function applyLang(lang) {
          current = lang;
          document.documentElement.lang = STRINGS[lang].lang;
          document.title = STRINGS[lang].title;
          document.querySelectorAll("[data-i18n]").forEach(function (el) {
            el.textContent = STRINGS[lang][el.getAttribute("data-i18n")];
          });
          toggle.textContent = lang === "fr" ? "English" : "Français";
          toggle.setAttribute(
            "aria-label",
            lang === "fr" ? "Switch to English" : "Passer en français"
          );
        }

        toggle.addEventListener("click", function () {
          applyLang(current === "fr" ? "en" : "fr");
        });

        var params = new URLSearchParams(
          window.location.hash.replace(/^#/, "") + "&" + window.location.search.replace(/^\?/, "")
        );

        console.log("URL params:", Object.fromEntries(params.entries()));

        // Three outcomes: the provider handed back a session (confirmed), an
        // error, or nothing at all (page opened directly / reloaded after the
        // URL was stripped). Decide before the first render so a language
        // toggle keeps whichever copy is showing.
        var errorName = params.get("error");
        var errorCode = params.get("error_code");
        var confirmed = params.get("access_token") || params.get("code");

        if (errorName || errorCode) {
          var serverSide = errorName === "server_error" || errorCode === "unexpected_failure";
          document.getElementById("error-title").setAttribute(
            "data-i18n",
            serverSide ? "serverErrorTitle" : "errorTitle"
          );
          document.getElementById("error-body").setAttribute(
            "data-i18n",
            serverSide ? "serverErrorBody" : "errorBody"
          );
          document.getElementById("idle").hidden = true;
          document.getElementById("error").hidden = false;
        } else if (confirmed) {
          document.getElementById("idle").hidden = true;
          document.getElementById("success").hidden = false;
        }

        var pref = (navigator.language || "fr").toLowerCase();
        applyLang(pref.indexOf("fr") === 0 ? "fr" : "en");

        // Strip tokens / error details from the URL so they aren't left in
        // history or shoulder-surfed.
        if (window.history.replaceState) {
          window.history.replaceState(null, "", window.location.pathname);
        }
      })();
    </script>
  </body>
</html>
